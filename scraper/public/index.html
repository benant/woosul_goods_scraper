<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>올리브영 랭킹 수집 대시보드</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
	<div class="brand">
		<h1>올리브영 랭킹 수집 대시보드</h1>
		<p class="sub" id="metaLine">불러오는 중…</p>
	</div>
	<div class="actions">
		<button id="btnCollect" class="primary">수집 실행</button>
		<button id="btnToggleJob" class="ghost" aria-expanded="false">수집 설정</button>
		<button id="btnRefresh">새로고침</button>
	</div>
</header>

<section class="panel job" id="jobPanel" hidden>
	<div class="job-head">
		<span class="badge" id="jobStatus">대기</span>
		<span id="jobText">수집 작업이 없습니다.</span>
		<span id="jobStalled" class="stalled" hidden>⚠ 진행이 멈춘 것 같습니다</span>
		<button id="btnStopJob" class="danger small" hidden>중지</button>
		<button id="btnCollapseJob" class="ghost small">접기</button>
	</div>
	<div class="progress"><div class="bar" id="jobBar"></div></div>
	<div class="job-grid">
	<details class="job-opts" open>
		<summary>수집 옵션</summary>
		<div class="job-opts-body">
		<label>카테고리당 최대 <input type="number" id="optTop" value="0" min="0" /><span class="hint">0 = 응답 전체(100개)</span></label>
		<label>요청 간 대기(ms) <input type="number" id="optDelay" value="1500" min="0" step="100" /><span class="hint">목록 수집</span></label>
		<label>상세 대기(ms) <input type="number" id="optDetailDelay" value="5000" min="0" step="500" /><span class="hint">상세페이지는 5초 권장</span></label>
		<label>카테고리 수 <input type="number" id="optLimit" value="0" min="0" /><span class="hint">0 = 전체</span></label>
		<label class="check"><input type="checkbox" id="optHeaded" /> 브라우저 표시(차단 시)</label>
		<label class="check" hidden><input type="checkbox" id="optImages" /> 상품이미지 로컬 저장 (images\/)</label>
		<label class="check"><input type="checkbox" id="optDetail" /> 상세페이지까지 이어서 수집 <span class="hint">매우 오래 걸림</span></label>
		<label class="check"><input type="checkbox" id="optForce" /> 이미 수집한 상품도 다시 받기</label>
		</div>
		<div class="job-btns">
			<button id="btnCollect2" class="primary">이 옵션으로 다시 실행</button>
			<button id="btnDetailCollect" class="ghost">상세만 수집</button>
			<button id="btnArticleCollect" class="ghost">고시만 수집</button>
		</div>
	</details>
	<div class="job-logcol">
		<h3 class="col-title">수집 로그</h3>
		<ul class="joblog" id="jobLog"></ul>
	</div>
	</div>
</section>

<section class="panel filters">
	<input type="search" id="fQ" placeholder="상품명 / 상품코드 검색" />
	<select id="fCategory"><option value="">전체 카테고리</option></select>
	<div class="multisel" id="brandSel">
		<button type="button" class="ms-btn" id="brandToggle" aria-expanded="false" aria-haspopup="listbox">전체 브랜드</button>
		<div class="ms-panel" id="brandPanel" hidden>
			<input type="search" id="brandSearch" placeholder="브랜드 검색" autocomplete="off" />
			<div class="ms-tools">
				<button type="button" class="linkbtn" id="brandAll">검색결과 전체 선택</button>
				<button type="button" class="linkbtn" id="brandNone">선택 해제</button>
				<span class="hint" id="brandCount"></span>
			</div>
			<ul class="ms-list" id="brandList"></ul>
		</div>
	</div>
	<select id="fFlag"><option value="">전체 배지</option></select>
	<input type="number" id="fMinPrice" placeholder="최소 가격" step="1000" />
	<input type="number" id="fMaxPrice" placeholder="최대 가격" step="1000" />
	<select id="fSort">
		<option value="effectivePrice">정렬: 실제가격</option>
		<option value="rank">정렬: 순위</option>
		<option value="rating">정렬: 평점</option>
		<option value="discountRate">정렬: 할인율</option>
		<option value="name">정렬: 상품명</option>
		<option value="brand">정렬: 브랜드</option>
		<option value="manufactureCountry">정렬: 제조국</option>
		<option value="capacity">정렬: 용량</option>
	</select>
	<select id="fOrder">
		<option value="asc">오름차순</option>
		<option value="desc">내림차순</option>
	</select>
	<button id="btnReset">초기화</button>
	<div class="spacer"></div>
	<button id="btnCsv" class="ghost">CSV 내려받기</button>
	<button id="btnXlsx" class="ghost">Excel(xlsx) 내려받기</button>
</section>

<p class="count">
	<span id="countLine"></span>
	<span class="fav-tools">
		<button id="btnFavView" class="ghost small" aria-pressed="false" title="담아둔 상품만 보기">♡ 찜 보기</button>
		<button id="btnFavCsv" class="ghost small" title="담아둔 상품만 CSV 내려받기">찜 CSV</button>
		<button id="btnFavXlsx" class="ghost small" title="담아둔 상품만 Excel 내려받기">찜 Excel</button>
		<button id="btnFavClear" class="ghost small" title="찜 전체 비우기">찜 비우기</button>
	</span>
</p>

<div class="tablewrap">
	<table id="tbl">
		<thead></thead>
		<tbody></tbody>
	</table>
</div>

<nav class="pager">
	<button id="pgFirst">처음</button>
	<button id="pgPrev">이전</button>
	<span id="pgInfo"></span>
	<button id="pgNext">다음</button>
	<button id="pgLast">마지막</button>
</nav>

<dialog id="detailModal" class="detailmodal">
	<div class="modal-head">
		<div>
			<h2 id="dmTitle">상품 상세</h2>
			<p id="dmMeta" class="sub"></p>
		</div>
		<div class="modal-actions">
			<button id="dmFav" class="small" title="이 상품을 찜에 담아둔다">♡ 찜</button>
			<button id="dmCollectDetail" class="small">상세 수집</button>
			<button id="dmCollectArticle" class="small">고시 수집</button>
			<a id="dmLink" class="small btnlike" href="#" target="_blank" rel="noopener">원본 페이지 열기</a>
			<button id="dmClose" class="ghost">닫기</button>
		</div>
	</div>
	<div id="dmBody" class="modal-body"></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
