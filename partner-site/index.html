<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>우슬 협력사 카탈로그</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23EC4899'/%3E%3C/svg%3E" />
<style>
	#boot {
		position: fixed;
		inset: 0;
		z-index: 80;
		display: grid;
		place-items: center;
		margin: 0;
		background: #fdf2f8;
		color: #831843;
		font-family: "Malgun Gothic", "Segoe UI", sans-serif;
		text-align: center;
	}
	#boot[hidden] { display: none; }
	#boot .spin {
		width: 42px;
		height: 42px;
		margin: 0 auto;
		border: 4px solid #fbcfe8;
		border-top-color: #ec4899;
		border-radius: 50%;
		animation: boot-spin 0.8s linear infinite;
	}
	@keyframes boot-spin { to { transform: rotate(360deg); } }
	#boot p { margin: 16px 0 0; font-weight: 700; }
	#boot .sub { margin-top: 6px; font-weight: 500; color: #9d174d; }
	@media (prefers-reduced-motion: reduce) {
		#boot .spin { animation: none; border-top-color: #ec4899; }
	}
</style>
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div id="boot" role="status" aria-live="polite">
	<div>
		<div class="spin" aria-hidden="true"></div>
		<p>상품 목록을 불러오는 중입니다</p>
		<p class="sub">Memuat katalog…</p>
	</div>
</div>
<div id="app"></div>
<noscript>
	<p>이 카탈로그는 자바스크립트가 필요합니다. Katalog ini memerlukan JavaScript.</p>
</noscript>
<script src="data/catalog.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
